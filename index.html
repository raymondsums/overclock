<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overclock</title>
<style>
:root{
  --bg:#e3e1db; --joint:#d3d0c8; --panel:#f1efea; --tile:#f4f2ee; --ink:#2e3135; --soft:#686a68; --line:#c9c6be;
  --char:#33363a; --yellow:#d3b24a; --steel:#a9afb2; --steel2:#80878b; --rubber:#2f3134; --rubber2:#4b4f53;
  --change:#a65b47; --add:#7a8f78; --mult:#4d6f94; --special:#3c8380; --rare:#a8873a;
  --change-ink:#8a4534; --add-ink:#506a4d; --mult-ink:#355a80; --special-ink:#2c6865;
  --good:#5b8758; --bad:#a8473a; --bend:#d3b24a;
  --cond:"DIN Condensed","Avenir Next Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#2a2b2a; --joint:#333432; --panel:#323431; --tile:#363835; --ink:#e9e7e1; --soft:#a3a39d; --line:#474945;
  --char:#1d1f21; --rubber:#1c1e20; --rubber2:#3a3e42;
  --change-ink:#d08a75; --add-ink:#a8bfa4; --mult-ink:#93b2d6; --special-ink:#86c2bd;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,system-ui,sans-serif}
/* the play screen is one viewport: no page scroll. Sheets scroll inside themselves. */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit}
.wrap{position:relative;max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top)) 16px 0}
.wrap>*{flex:none}

/* top */
.top{display:flex;align-items:center;gap:12px;font:13px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);padding-top:2px}
.top b{color:var(--ink);font-weight:700;font-size:15px}
.top .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;width:30px;height:30px;font:700 16px/1 var(--cond);cursor:pointer;padding-top:3px}

.quota{position:relative;z-index:8;margin:8px 0 0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px 9px;cursor:pointer}
.qrow{display:flex;align-items:baseline;gap:8px}
.qrow .lbl{font-size:12px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
.total{font:700 32px/.9 var(--cond);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.of{font:15px/1 var(--cond);letter-spacing:.05em;text-transform:uppercase;color:var(--soft);font-variant-numeric:tabular-nums}
.pullnum{margin-left:auto;font:700 16px/1 var(--cond);letter-spacing:.04em;color:var(--soft);font-variant-numeric:tabular-nums;text-transform:uppercase}
.pullnum.live{color:var(--ink)}
.bar{height:8px;border-radius:2px;background:color-mix(in srgb,var(--line) 70%,var(--bg));margin-top:7px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(0,0,0,.08)}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--yellow) 0 7px,color-mix(in srgb,var(--yellow) 78%,var(--char)) 7px 14px);transition:width .15s linear}
.bar.met i{background:var(--good)}
.bump{animation:bump .25s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}

/* board: the shop floor, drawn in iso */
/* the board takes whatever height is left; the camera fits into it (layoutFloor) */
.wrap>.board{flex:1 1 0;min-height:0}
.board{position:relative;margin:0 -16px;user-select:none;clip-path:inset(0 -100vw)}   /* clip top and bottom only, so the floor still runs out to the page edges on desktop */
/* cam holds the whole scene so a camera refit can ease from the old framing (runView) */
.cam{position:absolute;inset:0;transform-origin:0 0}
.floor{position:absolute;left:0;top:0;z-index:0;overflow:visible}
.cleat,.roll{animation:cleat var(--cleat,.06s) linear infinite;animation-play-state:paused}
.running .cleat,.running .roll{animation-play-state:running}
@keyframes cleat{to{stroke-dashoffset:-.25px}}
.chute{display:none}.chute.on{display:inline}

.tile{position:absolute;z-index:2;cursor:pointer;transform-origin:50% 70%}
.tile.r2{z-index:3}
.tile .bolt{position:absolute;left:50%;top:22%;width:24px;height:24px;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.tile .bolt svg{display:block;width:100%;height:100%}
.tile svg{position:absolute;left:0;top:0;overflow:visible}
.tile .mach{position:absolute;inset:0}
.tile .bay{fill:color-mix(in srgb,var(--joint) 60%,var(--bg));stroke:color-mix(in srgb,var(--char) 22%,transparent);stroke-width:1;vector-effect:non-scaling-stroke}
.tile .bay.bendbay{fill:url(#hzSoft)}
.tile .plus{stroke:var(--steel2);stroke-width:1.5;vector-effect:non-scaling-stroke;fill:none}
.tile.empty .bay{stroke-dasharray:4 3;stroke:var(--steel2)}
.tile.blocked{cursor:not-allowed}
.tile.blocked .bay{fill:url(#hzRed)}
.tile.target .bay{stroke:var(--char);stroke-width:2;stroke-dasharray:5 3}
.tile.target.occupied .bay{stroke:var(--bad)}
.tile.fresh .bay{stroke:var(--yellow);stroke-width:2.5;stroke-dasharray:none}
.tile.pop{animation:pop .3s ease-out}
.tile.pop .mg{animation:lit .35s ease-out}
.tile.reach{animation:reachpop .6s ease-out}
.tile.reach .bay{animation:bayflash .6s ease-out}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.09)}100%{transform:scale(1)}}
@keyframes lit{0%{filter:brightness(1)}30%{filter:brightness(1.22)}100%{filter:brightness(1)}}
@keyframes reachpop{0%{transform:scale(1)}30%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes bayflash{0%,60%{stroke:var(--yellow);stroke-width:4}100%{}}

.band{position:absolute;z-index:1;pointer-events:none;display:none}
.band svg{position:absolute;left:0;top:0;overflow:visible}
.band span{position:absolute;transform:translate(-50%,-50%);font:700 11px/1 var(--cond);letter-spacing:.1em;text-transform:uppercase;background:var(--yellow);color:var(--char);border-radius:2px;padding:3px 4px 1px;white-space:nowrap}
.band.off{opacity:.4;filter:grayscale(1)}
.band.flash{animation:bandflash .7s ease-out}
@keyframes bandflash{0%{filter:brightness(1.3) saturate(1.3);transform:scale(1.06)}100%{filter:none;transform:none}}

.end{position:absolute;z-index:2;pointer-events:none}
.end.bin{z-index:3}
.end .box{position:absolute;inset:0}
.end .box svg{position:absolute;left:0;top:0;overflow:visible}
.names{position:absolute;inset:0;z-index:4;pointer-events:none}
.bn{position:absolute;transform:translateX(-50%);font:700 11px/12px var(--cond);letter-spacing:.04em;text-transform:uppercase;color:var(--soft);width:max-content;max-width:var(--colw,58px);text-align:center;text-wrap:balance}
.bn.up{transform:translate(-50%,-100%)}
.board.narrow .bn{letter-spacing:0;font-size:10.5px}
.bn.end{max-width:none;white-space:nowrap}
.bn.rare{color:var(--rare)}
.bn.jam{color:var(--bad)}
.bn.end{color:var(--steel2)}

/* items */
.layer{position:absolute;inset:0;z-index:5;pointer-events:none}
.item{position:absolute;left:0;top:0;width:0;height:0;transition:opacity .2s}
.item .shape{position:absolute;transform:translate(-50%,-62%);width:var(--is,26px);height:calc(var(--is,26px)*.875)}
.item .shape svg{display:block;width:100%;height:100%;overflow:visible}
.item.morph .shape{animation:morph .3s ease-out}
@keyframes morph{0%{transform:translate(-50%,-62%) scale(.6)}60%{transform:translate(-50%,-62%) scale(1.2)}100%{transform:translate(-50%,-62%) scale(1)}}
.item .val{position:absolute;transform:translate(-50%,-100%);top:calc(var(--is,26px)*-.62 - 2px);font:700 12px/1 var(--cond);letter-spacing:.03em;font-variant-numeric:tabular-nums;background:var(--char);color:#f1efe8;border-radius:3px;padding:3px 4px 1px;white-space:nowrap}
.item .n{position:absolute;left:calc(var(--is,26px)*-.6);top:2px;font:700 11px/1 var(--cond);background:var(--mult);color:#fff;border-radius:3px;padding:2px 3px 0;display:none}
.item .lap{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--is,26px)*.38);font:700 11px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase;background:var(--special);color:#fff;border-radius:3px;padding:2px 4px 0;white-space:nowrap;display:none}
.item.multi .n{display:block}
.item.done{opacity:0}

.fx{position:absolute;left:0;top:0;z-index:6;pointer-events:none;overflow:visible}
.fx .arc{fill:none;stroke-linecap:round}
.fx .arc.a{stroke:var(--yellow);animation:arcin .25s ease-out both}
.fx .arc.b{stroke:var(--char);animation:arcfade .25s .15s ease-out both}
.fx g.go{animation:arcout .9s ease-in forwards}
@keyframes arcin{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes arcfade{from{opacity:0}to{opacity:1}}
@keyframes arcout{0%,70%{opacity:1}100%{opacity:0}}

.float{position:absolute;z-index:7;transform:translate(-50%,-100%);font:700 25px/1 var(--cond);letter-spacing:.02em;pointer-events:none;white-space:nowrap;animation:float 1.05s ease-out forwards;color:var(--ink);
  text-shadow:2px 0 0 var(--bg),-2px 0 0 var(--bg),0 2px 0 var(--bg),0 -2px 0 var(--bg),1.5px 1.5px 0 var(--bg),-1.5px -1.5px 0 var(--bg),1.5px -1.5px 0 var(--bg),-1.5px 1.5px 0 var(--bg);
  -webkit-mask-image:linear-gradient(#000 0 50%,transparent 50% 56%,#000 56%);mask-image:linear-gradient(#000 0 50%,transparent 50% 56%,#000 56%)}
.float.dn{transform:translate(-50%,0);animation-name:floatdn}
.float.k-change{color:var(--change-ink)} .float.k-add{color:var(--add-ink)}
.float.k-mult{color:var(--mult-ink)} .float.k-special{color:var(--special-ink)}
.float.bin{color:var(--good);font-size:28px}
.float.again{color:var(--special-ink);font-size:20px;letter-spacing:.08em;text-transform:uppercase}
.float.plain{color:var(--soft);font-size:18px}
.float.bend{-webkit-mask-image:none;mask-image:none;text-shadow:none;padding:4px;border-radius:5px;background:repeating-linear-gradient(-45deg,var(--char) 0 6px,var(--yellow) 6px 12px);animation:bendsign 1.35s ease-out forwards}
.float.bend.dn{animation-name:bendsigndn}
.float.bend .in{display:flex;align-items:baseline;gap:6px;background:var(--yellow);color:var(--char);border-radius:2px;padding:5px 9px 1px}
.float.bend b{font:700 34px/1 var(--cond)}
.board.tight .float{font-size:20px}
.board.tight .float.bend b{font-size:25px}
.board.tight .float.bend i{font-size:13px}
.board.tight .float.bend em{font-size:12px}
.board.tight .float.bend .in{padding:4px 7px 1px}
.float.bend i{font:700 17px/1 var(--cond);font-style:normal;letter-spacing:.12em;text-transform:uppercase}
.float.bend em{align-self:center;font:700 15px/1 var(--cond);font-style:normal;background:var(--char);color:var(--yellow);border-radius:2px;padding:3px 5px 1px;margin-left:2px;font-variant-numeric:tabular-nums}
@keyframes float{0%{opacity:0;margin-top:6px;scale:.7}15%{opacity:1;margin-top:0;scale:1.08}30%{scale:1}75%{opacity:1}100%{opacity:0;margin-top:-10px}}
@keyframes floatdn{0%{opacity:0;margin-top:-6px;scale:.7}15%{opacity:1;margin-top:0;scale:1.08}30%{scale:1}75%{opacity:1}100%{opacity:0;margin-top:10px}}
@keyframes bendsign{0%{opacity:0;scale:.4;rotate:-6deg}14%{opacity:1;scale:1.12;rotate:2deg}26%{scale:1;rotate:0deg}80%{opacity:1}100%{opacity:0;margin-top:-8px}}
@keyframes bendsigndn{0%{opacity:0;scale:.4;rotate:6deg}14%{opacity:1;scale:1.12;rotate:-2deg}26%{scale:1;rotate:0deg}80%{opacity:1}100%{opacity:0;margin-top:8px}}

/* status sits in the board's bottom lane on a soft scrim: above the floor, under machines, items and floats */
.status{position:absolute;left:14px;right:14px;bottom:0;z-index:1;pointer-events:none;margin:0;padding:16px 2px 4px;font-size:13px;line-height:1.3;color:var(--soft);background:linear-gradient(color-mix(in srgb,var(--bg) 0%,transparent),var(--bg) 14px)}
.status:empty{display:none}
.status b{color:var(--ink)}

/* hand: painted machine cards. Kind sets the paint: --k housing, --kb name band (a shade darker so light text holds), --ki tag ink */
.hand{--cols:5;display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:12px 6px;padding-top:12px}
.hand .card{flex:0 0 calc((100% - (var(--cols) - 1) * 6px) / var(--cols));min-width:0;max-width:92px}
.card{--k:var(--steel2);--kb:#5f6569;--ki:var(--soft);container-type:inline-size;position:relative;text-align:center;background:var(--tile);border:1px solid var(--line);border-radius:8px;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:stretch;
  box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--line) 70%,transparent);transition:transform .16s cubic-bezier(.3,.7,.4,1),box-shadow .16s ease-out,filter .2s,opacity .2s}
.card.k-change{--k:var(--change);--kb:#97503f;--ki:var(--change-ink)}
.card.k-add{--k:var(--add);--kb:#5b6f5a;--ki:var(--add-ink)}
.card.k-mult{--k:var(--mult);--kb:#46668a;--ki:var(--mult-ink)}
.card.k-special{--k:var(--special);--kb:#33736f;--ki:var(--special-ink)}
/* art window: kind tint above, a strip of floor below, the machine standing on it */
.card .win{position:relative;display:block;aspect-ratio:84/90;border-radius:7px 7px 0 0;overflow:hidden;
  background:linear-gradient(color-mix(in srgb,var(--k) 17%,var(--tile)) 0 88%,color-mix(in srgb,var(--k) 10%,var(--joint)) 88%)}
.card .art{position:absolute;left:3%;right:3%;bottom:1%;top:5%;width:94%;height:94%;display:block}
/* what it works on: a small drawn item on a pale plate */
.card .it{position:absolute;left:3px;top:3px;width:clamp(20px,30cqi,36px);aspect-ratio:32/28;padding:2px;border-radius:4px;background:color-mix(in srgb,var(--tile) 86%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--k) 35%,transparent)}
.card .it svg{display:block;width:100%;height:100%;overflow:visible}
.card .nm{display:block;background:var(--kb);color:#f4f1ea;font:700 clamp(11px,16.5cqi,18px)/1 var(--cond);letter-spacing:.03em;text-transform:uppercase;padding:.36em 3px .16em;min-height:2.24em;display:flex;align-items:center;justify-content:center;text-wrap:balance;overflow-wrap:normal}
.card .tg{flex:1;display:flex;align-items:center;justify-content:center;padding:.32em 3px .4em;min-height:2.8em;font:700 clamp(13px,20.5cqi,21px)/1.02 var(--cond);letter-spacing:.01em;color:var(--ki);text-wrap:balance}
.card .tg.k-change,.card .tg.k-add,.card .tg.k-mult,.card .tg.k-special{color:var(--ki)}
/* rares: a hazard striped edge and a yellow tab, same muted yellow as the quota bar */
.card.rare{border:3px solid transparent;background:linear-gradient(var(--tile),var(--tile)) padding-box,repeating-linear-gradient(-45deg,var(--yellow) 0 5px,color-mix(in srgb,var(--yellow) 62%,var(--char)) 5px 10px) border-box;box-shadow:none}
.card.rare .win{border-radius:5px 5px 0 0;aspect-ratio:auto;height:calc((100cqi + 4px) * 90 / 84 - 2px)}
.hand.two .card.rare .win{height:calc((100cqi + 4px) * 48 / 84 - 2px)}
.card .rr{position:absolute;left:50%;top:-10px;transform:translateX(-50%);z-index:2;font:700 11px/1 var(--cond);letter-spacing:.12em;color:var(--char);background:var(--yellow);border-radius:3px;padding:3px 6px 1px;box-shadow:0 0 0 1.5px var(--tile)}
/* lift and select */
@media (hover:hover){.card:hover{transform:translateY(-3px)}}
.card:active{transform:translateY(1px)}
.card.sel{transform:translateY(-10px);box-shadow:0 0 0 2.5px var(--k),0 14px 18px -10px rgba(30,32,34,.5)}
.card.rare.sel{box-shadow:0 0 0 2.5px var(--k),0 14px 18px -10px rgba(30,32,34,.5)}
.card.sel .tg{color:var(--ink)}
/* two rows of a big hand: shorter windows so both rows sit above the lever */
.hand.two{gap:8px 6px;padding-top:4px}
.hand.scroll{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;overflow-y:visible;scroll-snap-type:x mandatory;scroll-padding-left:16px;scrollbar-width:none;padding:14px 16px 6px;margin:-6px -16px 0;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.hand.scroll::-webkit-scrollbar{display:none}
.hand.scroll .card{flex:0 0 calc((100% - 32px - 4 * 6px) / 5.4);scroll-snap-align:start}
.hand.two .card .win{aspect-ratio:84/48}
.hand.two .card .tg{min-height:2.3em;padding:.24em 3px .3em}
/* locked during a pull: pushed back and desaturated, labels still read */
.hand.locked .card{pointer-events:none;filter:saturate(.45);opacity:.82;transform:none;box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--line) 70%,transparent)}
.hand.locked .card.rare{box-shadow:none}
/* during a run the hand slides down behind the lever bar and the board takes its room; it rises back for the next placement */
.hand.away{position:absolute;left:16px;right:16px;z-index:1;pointer-events:none;opacity:0;transform:translateY(48px);transition:transform .32s cubic-bezier(.5,0,.75,0),opacity .26s ease-in}
.hand.back{animation:handin .38s cubic-bezier(.2,.8,.3,1)}
@keyframes handin{from{opacity:0;transform:translateY(48px)}}
@media (prefers-reduced-motion:reduce){.hand.away{transition:none}.hand.back{animation:none}}

/* bottom bar */
.bottom{position:relative;z-index:2;background:var(--bg);padding:8px 0 calc(10px + env(safe-area-inset-bottom))}
.bottom .in{max-width:560px;min-height:54px;margin:0 auto;display:flex;align-items:center;gap:10px}
.ghost{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 14px;font:700 15px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding-top:12px}
.lever{margin-left:auto;border:none;background:var(--char);color:var(--yellow);border-radius:10px;padding:14px 30px 10px;font:700 24px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;min-width:150px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);transition:min-width .3s ease,padding .3s ease,font-size .3s ease,border-radius .3s ease}
.lever:active{transform:translateY(2px)}
/* the deck: a small pile of card backs with the count on top; it thins as you draw */
.pile{position:relative;width:48px;height:54px;min-width:44px;border:none;background:none;padding:0;cursor:pointer;flex:none}
.pile:active{transform:translateY(1px)}
.pile .bk{position:absolute;left:4px;bottom:4px;width:30px;height:42px;transform:translate(calc(var(--i) * 3px),calc(var(--i) * -3px));transition:transform .14s ease-out,opacity .14s ease-out}
.pile .bk svg{display:block}
.pile .bk.lift{transform:translate(calc(var(--i) * 3px),calc(var(--i) * -3px - 6px));opacity:0}
.pile .bk.grow{animation:pilein .14s ease-out}
@keyframes pilein{from{opacity:0;transform:translate(calc(var(--i) * 3px - 3px),calc(var(--i) * -3px + 3px))}}
.pile .bk.out{border:1.5px dashed #b9b2a3;border-radius:4px}
.pile .ct{position:absolute;right:-6px;bottom:-4px;min-width:16px;padding:2px 3px 0;border-radius:2px;background:#cfae45;color:#2e3135;font:700 12px/1.1 var(--cond);text-align:center;font-variant-numeric:tabular-nums}
.pile .bk.out .ct{right:50%;bottom:50%;transform:translate(50%,50%)}
@media (prefers-reduced-motion:reduce){.pile .bk{transition:none}.pile .bk.lift{transform:translate(calc(var(--i) * 3px),calc(var(--i) * -3px))}.pile .bk.grow{animation:none}}
/* during a run the lever folds down to a small Faster control */
.lever.fast{min-width:0;padding:11px 16px 8px;font-size:16px;letter-spacing:.1em;border-radius:8px;background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line),inset 0 -3px 0 color-mix(in srgb,var(--line) 70%,transparent)}
.lever.fast.on{background:var(--char);color:var(--yellow);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
@media (prefers-reduced-motion:reduce){.lever{transition:none}}

/* sheets */
.veil{position:fixed;inset:0;background:rgba(30,32,34,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#muteBtn{position:relative;z-index:21}   /* mute stays reachable above an open sheet; "?" stays under it */
.veil.on{display:flex}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));max-height:88vh;max-height:88dvh;overflow:auto;overscroll-behavior:contain}
@media (min-width:600px){.veil{align-items:center}.sheet{border-radius:14px}}
.sheet h2{margin:0 0 6px;font:700 28px/1.05 var(--cond);letter-spacing:.02em;text-transform:uppercase}
.sheet p{margin:6px 0;color:var(--soft)}
.sheet p b{color:var(--ink)}
.sheet p.aside{margin-top:-2px;font-size:14px}
.sheet p.endline{margin:2px 0 10px;font:700 18px/1.2 var(--cond);letter-spacing:.03em;color:var(--ink)}
.sheet p.shipped{margin:12px 0;padding:9px 12px 7px;border-radius:6px;background:var(--tile);border:1px solid var(--line);font:700 16px/1.1 var(--cond);letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
.sheet p.shipped b{color:var(--ink)}
.sheet ul{margin:8px 0 12px;padding-left:18px}.sheet li{margin:4px 0}
.sheet .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 12px}
.sheet .opts .card{border-radius:10px}
.sheet .opts .card .win{border-radius:9px 9px 0 0}
.sheet .opts .card.rare .win{border-radius:7px 7px 0 0}
.sheet .opts .card .it{left:5px;top:5px}
.sheet .opts .card .tg{padding:.4em 6px .5em}
.sheet .deckgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px;margin:16px 0 10px}
.sheet .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.primary{border:none;background:var(--char);color:var(--yellow);border-radius:8px;padding:13px 18px 10px;font:700 17px/1 var(--cond);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.kicker{font:700 13px/1 var(--cond);text-transform:uppercase;letter-spacing:.1em;color:var(--soft)}
.met{color:var(--good)} .miss{color:var(--bad)}
.list{font-size:14px;margin:6px 0 14px}
.list div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:5px 0}
/* order slip under the bar */
.slip{margin-top:6px;white-space:nowrap}
.slip b{font:700 14px/1.1 var(--cond);letter-spacing:.04em;text-transform:uppercase;color:var(--ink);display:block;padding-top:2px}
.slip:empty{display:none}
/* the note: a small tag under the panel, over the top of the board, shown at shift start and on tap */
.tip{position:absolute;left:10px;right:10px;top:calc(100% + 4px);display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none;opacity:0;transform:translateY(-4px);transition:opacity .35s,transform .35s}
.tip.on{opacity:1;transform:none}
.tip span{background:var(--char);color:#f1efe8;font-size:13px;line-height:1.25;border-radius:5px;padding:5px 9px}
/* boss shift: a hazard edged plate on the quota panel */
.rule{margin-top:7px;font-size:13px;color:var(--soft)}
.rule b{color:var(--bad)}
.rule .boss{position:relative;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:7px;row-gap:1px;border-radius:5px;padding:4px 8px 3px 16px;background:color-mix(in srgb,var(--yellow) 14%,var(--tile));border:1px solid color-mix(in srgb,var(--yellow) 45%,var(--line));overflow:hidden}
.rule .boss::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 5px,color-mix(in srgb,var(--yellow) 62%,var(--char)) 5px 10px)}
.rule .boss .bk{font:700 12px/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.rule .boss b{font:700 14.5px/1.1 var(--cond);letter-spacing:.03em;text-transform:uppercase;color:var(--bad);padding-top:2px}
.rule .boss .bl{font-size:12px;line-height:1.3;color:var(--ink)}
.story p{margin:6px 0;color:var(--ink)}
.shifts{margin:6px 0 12px}
.sheet .rule.nextboss{margin:6px 0 0;font-size:13px}
/* end sheet: four small tiles, the story folded away */
.etiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0 8px}
@media (min-width:600px){.etiles{grid-template-columns:repeat(4,1fr)}}
.et{display:grid;grid-template-columns:30px 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;background:var(--tile);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.et .ei{grid-row:1 / 3;width:30px;height:30px;color:var(--soft);display:grid;place-items:center}
.et .ei svg{width:100%;height:100%;display:block}
.et b{font:700 22px/1 var(--cond);font-variant-numeric:tabular-nums;color:var(--ink);padding-top:3px;white-space:nowrap;overflow:hidden;text-overflow:clip}
.et b.nm{font-size:16px;letter-spacing:.03em;text-transform:uppercase}
.et span:last-child{font:700 11px/1.15 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.et i{font-style:normal;color:var(--good)}
.sheet details.more{margin:4px 0 12px}
.sheet details.more summary{cursor:pointer;font:700 14px/1 var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--soft);padding:10px 0;list-style:none}
.sheet details.more summary::-webkit-details-marker{display:none}
.sheet details.more summary::after{content:" +"}
.sheet details.more[open] summary::after{content:" -"}
.primary.big{width:100%;padding:16px 18px 13px;font-size:20px}
.srow{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.srow .sn{font-weight:800;font-variant-numeric:tabular-nums;color:var(--soft)}
.srow .sm{display:flex;flex-direction:column;gap:3px;min-width:0}
.srow .sb{height:6px;border-radius:2px;background:var(--line);overflow:hidden}
.srow .sb i{display:block;height:100%;background:var(--good)}
.srow.lost .sb i{background:var(--bad)}
.srow .st{font-size:12px;color:var(--soft)}
.srow .sv{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;text-align:right}
.srow .sv small{color:var(--soft);font-weight:500}
.fine{font-size:12px;line-height:1.35;color:var(--soft);margin:10px 0 0}
/* INTRO: picture intro, one-time tips and the illustrated rules (intro.js) */
.sheet:has(.intro){padding-top:16px;max-height:96vh;max-height:96dvh}
@media (min-width:900px){.sheet:has(.intro){max-width:1180px;padding:24px 28px 28px}}
.intro-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.intro-head .kicker{order:2}
.sheet h2.intro-mark{margin:0;font:700 34px/1 var(--cond);letter-spacing:.04em;text-transform:uppercase}
.intro-frames{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
@media (min-width:900px){.intro-frames{grid-template-columns:repeat(3,1fr);gap:18px;margin-top:16px}}
.ifr{margin:0}
.istage{position:relative;aspect-ratio:20/7;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden;container-type:inline-size}
.istage *{pointer-events:none}
.istage>svg{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
.sheet p.icap{margin:4px 0 0;font:700 17px/1.15 var(--cond);letter-spacing:.03em;color:var(--ink)}
.intro-row{margin-top:12px;align-items:center}
.ilink{border:none;background:none;padding:10px 6px;font-size:14px;color:var(--soft);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.sheet p.istart{margin:4px 0 2px}
/* frame drawings */
.ibay{fill:color-mix(in srgb,var(--joint) 60%,var(--bg));stroke:color-mix(in srgb,var(--char) 22%,transparent);stroke-width:1;vector-effect:non-scaling-stroke}
.ibay.ihot{fill:none;stroke:var(--yellow);stroke-width:2.5}
.iplus{stroke:var(--steel2);stroke-width:1.5;fill:none}
.fa-mach,.fb-m,.fb-tote{transform-box:fill-box;transform-origin:50% 85%}
.fb-t{transform-box:fill-box;transform-origin:50% 50%}
.fa-plus{opacity:0}
.ilabel{font:700 11px/1 var(--cond);letter-spacing:.04em;text-transform:uppercase;fill:var(--steel2)}
.ifloat{font:700 22px/1 var(--cond);letter-spacing:.02em;fill:var(--good);stroke:var(--bg);stroke-width:4;paint-order:stroke;stroke-linejoin:round}
.irun{font:700 19px/1 var(--cond);letter-spacing:.14em;fill:var(--yellow)}
.fb-dot{fill:rgba(255,255,255,.35);stroke:var(--char);stroke-width:2;opacity:0}
.icard{position:absolute;width:0;height:0;z-index:2;opacity:0;scale:.34}
.icard .card{position:absolute;left:0;top:0;width:15cqw;transform:translate(-50%,-26%);cursor:default}
.idot{position:absolute;z-index:3;width:20px;height:20px;margin:-6px 0 0 -10px;border-radius:50%;border:2px solid var(--char);background:rgba(255,255,255,.4);opacity:0}
/* frame 3: the order panel and a 3-run dial */
.fc-in{position:absolute;inset:0;display:flex;align-items:center;gap:5%;padding:0 6%}
.iq{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px 10px}
.fc-num{display:inline-grid}
.fc-num i{grid-area:1/1;justify-self:end;font-style:normal;opacity:0}
.fc-num .fc-n3{opacity:1;color:var(--good)}
.fc .bar i{width:100%;background:var(--good);transition:none}
.idial{height:80%;aspect-ratio:1;flex:none}
.idial-face{fill:var(--tile);stroke:var(--char);stroke-width:3}
.idial-s{fill:color-mix(in srgb,var(--char) 72%,var(--tile))}
.idial-tick{stroke:var(--char);stroke-width:2;fill:none}
.idial-hand{stroke:var(--yellow);stroke-width:4;stroke-linecap:round}
.fc-hand{transform-box:view-box;transform-origin:40px 40px}
.idial-pin{fill:var(--yellow);stroke:var(--char);stroke-width:2}
/* tips in play: over the board's top lane, never over Run or the hand */
.introtip{position:absolute;z-index:9;top:6px;left:50%;width:min(340px,calc(100% - 24px));display:flex;align-items:center;gap:10px;padding:5px 12px 5px 16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;
  opacity:0;transform:translate(-50%,-6px);transition:opacity .25s,transform .25s}
.introtip.on{opacity:1;transform:translate(-50%,0)}
.introtip.over{position:fixed;z-index:25;top:calc(10px + env(safe-area-inset-top))}
.introtip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 5px,color-mix(in srgb,var(--yellow) 62%,var(--char)) 5px 10px)}
.introtip.t-loop::before{background:var(--special)}
.introtip .ipic{width:58px;height:62px;flex:none;margin:-2px 0}
.introtip.t-loop .ipic{width:74px;height:56px}
.introtip .itxt{font-size:13px;line-height:1.3;color:var(--ink)}
.introtip .nw{white-space:nowrap}
/* illustrated rules */
.ihelp .ihelp-fig{display:block;margin-top:4px}
.ihelp .ipic{width:84px;height:90px;display:block}
.ichain{display:flex;align-items:flex-start;gap:3px;padding:2px 0}
.istep{display:flex;flex-direction:column;align-items:center;min-width:36px}
.istep svg{width:32px;height:28px;display:block;overflow:visible}
.istep small{margin-top:3px;font:700 11px/1 var(--cond);letter-spacing:.04em;text-transform:uppercase;color:var(--soft);white-space:nowrap}
.iarr{width:12px;height:10px;margin-top:10px;flex:none;color:var(--steel2)}
.ihelp-boss{display:block;max-width:300px}
@media (prefers-reduced-motion:reduce){.intro,.intro *{animation:none !important}.introtip{transition:none}}
/* /INTRO */
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span>Job <b id="runNo">1</b></span>
    <span>Shift <b id="shiftNo">1</b></span>
    <span>Run <b id="pullNo">1</b> of <span id="pullMax">3</span></span>
    <span class="sp"></span>
    <button class="iconbtn" id="helpBtn" aria-label="How it works">?</button>
  </div>

  <div class="quota">
    <div class="qrow">
      <span class="total" id="total">0</span>
      <span class="of">of <span id="quota">50</span></span>
      <span class="pullnum" id="pullTotal"></span>
    </div>
    <div class="bar" id="bar"><i></i></div>
    <div class="slip" id="slip"></div>
    <div class="rule" id="rule" style="display:none"></div>
    <div class="tip" id="tip"></div>
  </div>

  <div class="board" id="board"><div class="cam" id="cam">
    <svg class="floor" id="floor"></svg>
    <div class="band" data-pair="0"><svg></svg><span>bend</span></div>
    <div class="band" data-pair="1"><svg></svg><span>bend</span></div>
    <div class="band" data-pair="2"><svg></svg><span>bend</span></div>
    <div class="band" data-pair="3"><svg></svg><span>bend</span></div>
    <div class="band" data-pair="4"><svg></svg><span>bend</span></div>
    <div class="end hop"><div class="box" id="hopBox"></div></div>
    <div class="end bin"><div class="box" id="binBox"></div></div>
    <div class="names" id="names"></div>
    <div class="layer" id="layer"></div>
    <svg class="fx" id="fx"></svg>
  </div>
    <div class="status" id="status"></div>
  </div>

  <div class="hand" id="hand"></div>

  <div class="bottom"><div class="in">
    <button class="pile" id="deckBtn" type="button" aria-label="Deck"></button>
    <button class="lever" id="lever">Run</button>
  </div></div>
</div>

<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>
<script src="engine.js"></script>
<script src="sound.js"></script>
<script src="intro.js"></script>
<script src="game.js"></script>
</body>
</html>
